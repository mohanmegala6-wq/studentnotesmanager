```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Notes Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 Student Notes Manager</h1>
        <p>Organize and store your study materials easily.</p>
    </header>

    <main>
        <section class="form-box">
            <h2>📂 Upload Study Materials</h2>

            <label for="materialSubject">Subject</label>
            <input type="text" id="materialSubject"
                   placeholder="Example: Python">

            
<label for="materialFile">Choose your material</label>

<input
    type="file"
    id="materialFile"
    accept=".pdf,.docx,.ppt,.pptx,.doc,.txt"
>

<p class="file-help">
    Click Choose File and select a PDF or DOCX file.
</p>


            <button type="button" id="uploadButton">
                Upload Material
            </button>

            <div id="materialsList"></div>
        </section>
    </main>

    <footer>
        <p>Made with ❤️ by a student</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
```
